events { worker_connections 1024; }

http {
  client_max_body_size 200m;
  # A near-200MB CAD file (.3dm) can take several minutes to upload on a
  # slow connection — 120s was cutting those off mid-transfer.
  client_body_timeout 600s;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/plain text/css text/xml text/javascript
             application/json application/javascript application/xml application/xml+rss
             application/vnd.ms-fontobject application/x-font-ttf font/opentype
             image/svg+xml image/x-icon;

  # dashboard.kirajewels.one → frontend
  server {
    listen 80;
    server_name dashboard.kirajewels.one;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # api.kirajewels.one → backend
  server {
    listen 80;
    server_name api.kirajewels.one;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      proxy_pass http://api:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
