events { worker_connections 1024; }

http {
  client_max_body_size 50m;
  proxy_read_timeout 120s;

  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # Redirect all HTTP → HTTPS
  server {
    listen 80;
    server_name portal.kirajewels.one api.kirajewels.one;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # portal.kirajewels.one (HTTPS)
  server {
    listen 443 ssl;
    server_name portal.kirajewels.one;

    ssl_certificate     /etc/letsencrypt/live/portal.kirajewels.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.kirajewels.one/privkey.pem;

    location / {
      proxy_pass http://web:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_cache_bypass $http_upgrade;
    }
  }

  # api.kirajewels.one (HTTPS)
  server {
    listen 443 ssl;
    server_name api.kirajewels.one;

    ssl_certificate     /etc/letsencrypt/live/api.kirajewels.one/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kirajewels.one/privkey.pem;

    location / {
      proxy_pass http://api:4000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
