version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: jewelflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jewelflow
      POSTGRES_PASSWORD: jewelflow123
      POSTGRES_DB: jewelflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jewelflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jewelflow-api
    restart: unless-stopped
    env_file: ./backend/.env.production
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jewelflow-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: http://api:4000

  nginx:
    image: nginx:alpine
    container_name: jewelflow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  uploads_data:
  certbot_conf:
  certbot_www:
