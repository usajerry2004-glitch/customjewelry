version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: jewelflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-jewelflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jewelflow123}
      POSTGRES_DB: ${DB_NAME:-jewelflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jewelflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jewelflow-api
    restart: unless-stopped
    env_file: ./backend/.env.production
    environment:
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.kirajewels.one/api/v1}
    container_name: jewelflow-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: http://api:4000
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: jewelflow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
      - web

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  uploads_data:
  certbot_conf:
  certbot_www:
